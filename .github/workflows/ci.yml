name: ci

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build (development configuration)
        working-directory: firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32
          idf.py build
          idf.py size
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/esp32_tinyml_keyword_spotting.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ML runtime (for golden-vector test)
        run: pip install -r ml/requirements-runtime.txt
      - name: Host tests
        run: python tests/host/run_tests.py --golden
