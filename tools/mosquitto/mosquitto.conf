# Mosquitto 2.x broker for esp32-tinyml-keyword-spotting devices: TLS with client certificates.
# Certificates come from tools/gen_broker_cert.py (server) and
# tools/provision_device.py (devices), both signed by secrets/ca_cert.pem.

per_listener_settings true

listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca_cert.pem
certfile /mosquitto/certs/server_cert.pem
keyfile  /mosquitto/certs/server_key.pem
tls_version tlsv1.2
require_certificate true
# The certificate CN becomes the MQTT username, used by the ACL below.
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
